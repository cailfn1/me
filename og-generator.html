<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>og card generator · cail.love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #ff8aab; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0a0a0a; color: #ece8f0;
      font-family: 'JetBrains Mono', monospace;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      padding: 32px 16px 60px;
    }
    h1 { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 26px; margin: 0; }
    p { color: #8a8a96; font-size: 13px; max-width: 760px; text-align: center; line-height: 1.6; margin: 0; }
    .canvas-wrap { width: 100%; max-width: 760px; border: 1px solid rgba(180,30,70,0.4); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    canvas { display: block; width: 100%; height: auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
      cursor: pointer; padding: 11px 22px; border-radius: 999px; color: #ffe6ed;
      background: linear-gradient(135deg, #a01a40, #6a0820); border: 1px solid rgba(255,138,171,0.35);
      box-shadow: 0 4px 16px rgba(120,10,40,0.4); transition: transform .15s ease, filter .15s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.15); }
    .steps { color: #6b6b78; font-size: 12px; max-width: 620px; line-height: 1.7; }
    .steps b { color: var(--accent); }
    code { color: var(--accent); background: rgba(180,30,70,0.14); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>og card generator</h1>
  <p>This draws cail.love's social-share card at exactly <b style="color:#ff8aab">1200×630</b>. Click download, then drop the file into the site's <code>assets/</code> folder as <code>og.png</code>.</p>
  <div class="canvas-wrap"><canvas id="og" width="1200" height="630"></canvas></div>
  <div class="row">
    <button id="dl">↓ download og.png</button>
    <button id="redraw">↻ redraw</button>
  </div>
  <div class="steps">
    <b>1.</b> Click <b>download og.png</b> · <b>2.</b> save it into <code>cails bio/assets/og.png</code> · <b>3.</b> tell me — I'll switch the share meta to this card.
  </div>

  <script>
    const canvas = document.getElementById('og');
    const ctx = canvas.getContext('2d');
    const W = 1200, H = 630;

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw(avatar) {
      // base background
      const bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 80, W * 0.5, H * 0.5, W * 0.75);
      bg.addColorStop(0, '#120a10');
      bg.addColorStop(1, '#070407');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // blood-moon glow, top-right
      const moon = ctx.createRadialGradient(W - 150, 120, 20, W - 150, 120, 460);
      moon.addColorStop(0, 'rgba(200,40,80,0.30)');
      moon.addColorStop(0.4, 'rgba(150,20,55,0.14)');
      moon.addColorStop(1, 'rgba(120,14,36,0)');
      ctx.fillStyle = moon;
      ctx.fillRect(0, 0, W, H);

      // faint stars
      ctx.fillStyle = 'rgba(255,220,230,0.5)';
      for (let i = 0; i < 90; i++) {
        const x = Math.random() * W, y = Math.random() * H, r = Math.random() * 1.3;
        ctx.globalAlpha = 0.2 + Math.random() * 0.5;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 月 watermark
      ctx.font = "300px 'Instrument Serif', serif";
      ctx.fillStyle = 'rgba(180,30,70,0.06)';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText('月', W - 40, H / 2);

      // avatar with crimson ring
      const av = 250, ax = 96, ay = (H - av) / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(200,30,70,0.55)';
      ctx.shadowBlur = 40;
      roundRect(ax, ay, av, av, 28); ctx.fillStyle = '#1a0c12'; ctx.fill();
      ctx.restore();
      if (avatar) {
        ctx.save(); roundRect(ax, ay, av, av, 28); ctx.clip();
        ctx.drawImage(avatar, ax, ay, av, av);
        ctx.restore();
      }
      ctx.save();
      roundRect(ax, ay, av, av, 28);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,138,171,0.75)'; ctx.stroke();
      ctx.restore();

      // text block
      const tx = ax + av + 64;
      ctx.textAlign = 'left';

      // name
      ctx.font = "150px 'Pirata One', 'Instrument Serif', serif";
      ctx.fillStyle = '#f3eef4';
      ctx.shadowColor = 'rgba(200,30,70,0.7)'; ctx.shadowBlur = 34;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('cail', tx, 300);
      const cailW = ctx.measureText('cail').width;
      ctx.fillStyle = '#ff5878';
      ctx.fillText('.', tx + cailW + 4, 300);
      ctx.shadowBlur = 0;

      // tagline
      ctx.font = "italic 44px 'Instrument Serif', serif";
      ctx.fillStyle = '#c9a9b6';
      ctx.fillText('gym · anime · code', tx, 364);

      // accent line
      ctx.fillStyle = 'rgba(180,30,70,0.7)';
      ctx.fillRect(tx, 392, 240, 3);

      // subline
      ctx.font = "22px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#7a7480';
      ctx.fillText('hand-coded in the dark — no framework, no build step', tx, 440);

      // url chip
      ctx.font = "600 24px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#ff8aab';
      ctx.fillText('cail.love', tx, 492);

      // scanlines
      ctx.fillStyle = 'rgba(255,255,255,0.018)';
      for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

      // border frame
      ctx.strokeStyle = 'rgba(180,30,70,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, W - 2, H - 2);
    }

    function render() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => draw(img);
      img.onerror = () => draw(null);
      img.src = '/assets/avatar.jpg?cb=' + Date.now();
    }

    document.getElementById('dl').addEventListener('click', () => {
      canvas.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'og.png';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }, 'image/png');
    });
    document.getElementById('redraw').addEventListener('click', render);

    (document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
  </script>
</body>
</html>
