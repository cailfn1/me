<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — cail.love</title>
  <meta name="description" content="you've drifted into the void." />
  <meta name="theme-color" content="#04020a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z' fill='%238a1538'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Pirata+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04020a;
      --text: #ece8f0;
      --muted: #8a849a;
      --pink: #ff8aab;
      --wine: #8a1538;
      --blood: #a01a40;
      --serif: 'Instrument Serif', serif;
      --gothic: 'Pirata One', 'Instrument Serif', serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
    }
    body {
      background:
        radial-gradient(1200px 800px at 70% 20%, rgba(90, 12, 30, 0.5) 0%, transparent 60%),
        radial-gradient(1000px 700px at 20% 80%, rgba(60, 8, 20, 0.5) 0%, transparent 60%),
        linear-gradient(135deg, #040104 0%, #080208 50%, #020001 100%);
      cursor: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M 14 2 C 19 7 23 13 20 21 C 18 25 14 26 14 26 C 14 26 10 25 8 21 C 5 13 9 7 14 2 Z' fill='%2315101a' stroke='%237a0a22' stroke-width='1' stroke-linejoin='round'/%3E%3Cpath d='M 14 5 L 14 23' stroke='%235a4a5a' stroke-width='0.6' opacity='0.55'/%3E%3C/svg%3E") 14 2, default;
    }
    .stars { position: fixed; inset: 0; z-index: -3; pointer-events: none; overflow: hidden; }
    .star {
      position: absolute;
      width: 1.5px; height: 1.5px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 3px rgba(255,255,255,0.5);
      animation: tw 5s ease-in-out infinite;
    }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .moon {
      position: fixed;
      top: -22vh; right: -16vw;
      width: 80vh; height: 80vh;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(circle at 40% 38%, rgba(255, 90, 110, 0.16) 0%, rgba(180, 30, 60, 0.22) 22%, rgba(120, 14, 36, 0.18) 38%, transparent 58%);
      filter: blur(8px);
      animation: moonPulse 14s ease-in-out infinite;
      opacity: 0.85;
    }
    @keyframes moonPulse {
      0%, 100% { transform: scale(1);    opacity: 0.85; }
      50%      { transform: scale(1.04); opacity: 1; }
    }
    .crow {
      position: fixed;
      top: 14vh; left: -8vw;
      width: 38px; height: 22px;
      z-index: -1;
      opacity: 0.85;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
      animation: crowGlide 28s linear infinite;
    }
    .crow svg { display: block; width: 100%; height: 100%; fill: #050208; animation: wingBeat 0.35s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes wingBeat { from { transform: scaleY(1); } to { transform: scaleY(0.55); } }
    @keyframes crowGlide {
      0%   { left: -8vw; top: 18vh; }
      50%  { left: 50vw; top: 14vh; }
      100% { left: 110vw; top: 22vh; }
    }
    .center {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
    }
    .code {
      font-family: var(--gothic);
      font-size: clamp(8rem, 22vw, 14rem);
      line-height: 1;
      letter-spacing: 0.03em;
      color: var(--text);
      text-shadow:
        0 0 20px rgba(180, 30, 70, 0.6),
        0 0 50px rgba(120, 10, 40, 0.45),
        0 6px 30px rgba(0, 0, 0, 0.7);
      animation: bleed 4s ease-in-out infinite;
    }
    @keyframes bleed {
      0%, 100% { text-shadow: 0 0 20px rgba(180, 30, 70, 0.6), 0 0 50px rgba(120, 10, 40, 0.45), 0 6px 30px rgba(0, 0, 0, 0.7); }
      50%      { text-shadow: 0 0 28px rgba(200, 50, 90, 0.7), 0 0 70px rgba(140, 18, 50, 0.55), 0 6px 30px rgba(0, 0, 0, 0.7); }
    }
    .quip {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(20px, 3vw, 28px);
      color: rgba(236, 232, 240, 0.78);
      max-width: 540px;
      letter-spacing: 0.4px;
      line-height: 1.4;
      margin: 0;
    }
    .quip-sub {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(180, 30, 70, 0.55);
      margin-top: -4px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 11px 22px;
      font-family: var(--mono);
      font-size: 12px;
      text-transform: lowercase;
      letter-spacing: 0.18em;
      color: rgba(236, 232, 240, 0.85);
      background: rgba(20, 8, 24, 0.6);
      border: 1px solid rgba(180, 30, 70, 0.4);
      border-radius: 999px;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.22s ease;
    }
    .back:hover {
      border-color: rgba(255, 138, 171, 0.7);
      background: rgba(40, 12, 36, 0.7);
      box-shadow: 0 0 24px rgba(180, 30, 70, 0.35);
      transform: translateY(-2px);
    }
    .back-arrow {
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: rgba(255, 138, 171, 0.85);
    }
    .url-note {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(180, 30, 70, 0.35);
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="crow">
    <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="14" rx="5.5" ry="2.4"/>
      <circle cx="14" cy="13" r="2.4"/>
      <path d="M 11.5 13 L 8.5 13.5 L 11.5 14 Z"/>
      <path d="M 20 12 L 8 4 Q 14 9 18 11 Z"/>
      <path d="M 20 12 L 32 4 Q 26 9 22 11 Z"/>
    </svg>
  </div>
  <div class="center">
    <div class="code">404</div>
    <p class="quip">you've drifted into the void.</p>
    <p class="quip-sub">no path leads here</p>
    <a class="back" href="/">
      <span class="back-arrow">←</span>
      <span>back to cail.love</span>
    </a>
  </div>
  <div class="url-note">cail.love · lost &amp; wandering</div>
  <script>
    // tiny starfield
    const host = document.getElementById('stars');
    if (host) {
      for (let i = 0; i < 90; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = (Math.random() * 100).toFixed(2) + 'vw';
        s.style.top  = (Math.random() * 100).toFixed(2) + 'vh';
        s.style.opacity = (Math.random() * 0.6 + 0.4).toFixed(2);
        s.style.animationDelay = (Math.random() * 5).toFixed(1) + 's';
        s.style.animationDuration = (4 + Math.random() * 4).toFixed(1) + 's';
        host.appendChild(s);
      }
    }
  </script>
</body>
</html>
